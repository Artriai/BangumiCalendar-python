# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # 定时任务，在每天的北京时间 00:00（UTC 16:00）执行
    - cron: '0 16 * * *'
      # 定时器更改时间
      # https://tool.lu/crontab/
      # https://datetime360.com/cn/utc-cst-china-time/ #UTC时间 国际协调时间+8=北京时间
      # https://docs.github.com/cn/actions/using-workflows/workflow-syntax-for-github-actions#onschedule 官方参考

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: set python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run mainCode
        run: python main.py

      - name: Deploy target.ics to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Copy target.ics to a temp folder, switch branch, and force push
          mkdir ../temp_dir
          cp target.ics ../temp_dir/
          git fetch origin
          
          # Check out or create orphan gh-pages branch
          git checkout --orphan gh-pages
          git rm -rf .
          cp ../temp_dir/target.ics .
          git add target.ics
          git commit -m "Update calendar: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push --force origin gh-pages

env:
  #设置secrets的环境变量
  USERID: ${{ secrets.USERID }}
